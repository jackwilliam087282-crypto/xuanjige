<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>玄机阁 · 八字每日运势</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ============================================================
 * 【1.9.0】全站设计令牌 —— 依据 docs/visual-spec-1.9.0.md §2
 *
 * 1.8.x 的底色是「纯黑平底 + 零散暖金」，导致：
 *   · 页面、卡片、弹层三级底色区分度不足，层级靠描边硬撑；
 *   · 正文、次要说明、辅助提示三档文字亮度差过小，长时间阅读易疲劳；
 *   · 星云/节气/太极等装饰层与信息层抢对比度。
 * 1.9.0 改为「深海蓝分层 + 金只作焦点 + 四级文字」，
 * 并把全站散落的硬编码色值统一收敛到本组令牌。
 * ============================================================ */
:root{
  /* —— 底色：深海蓝分层，取代 1.8.x 的纯黑平底 —— */
  --abyss-0:#04060f;   /* 最深：过场遮罩底*/
  --abyss-1:#070b1a;   /* 页面最底 */
  --abyss-2:#0b1226;   /* 卡片底 */
  --abyss-3:#111a33;   /* 卡片抬升面 / 输入框 */
  --abyss-4:#182342;   /* 悬停 / 选中面 */

  /* —— 强调：金色仅作焦点与边线 —— */
  --gold-1:#8a6d28;    /* 最暗金：刻度线 */
  --gold-2:#a8862f;    /* 常规金：环纹 */
  --gold-3:#d4a853;    /* 亮金：焦点、标题 */
  --gold-4:#f0d696;    /* 最亮金：中心高光 */
  --on-gold:#0a0d18;   /* 金底之上的文字/图标色（深色，保证与亮金高对比） */

  /* —— 朱红：仅少量强调，禁止满屏 —— */
  --cinnabar:#c8402a;       /* 朱砂 */
  --cinnabar-hi:#e08878;    /* 朱砂文字（浅一档，保证可读） */
  --cinnabar-dim:rgba(200,64,42,.16);

  /* —— 文本：四级，对比度递减 —— */
  --i:0;--x:0px;--y:0px;
  --ink-1:#e8ecf5;     /* 主要测算文字 */
  --ink-2:#b8c0d4;     /* 次要说明 */
  --ink-3:#8490a8;     /* 辅助提示 */
  --ink-4:#5a6478;     /* 弱化 / 占位 */

  /* —— 间距与圆角（§2.3） —— */
  --sp-1:4px;  --sp-2:8px;  --sp-3:12px;
  --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r-1:6px;   --r-2:10px;  --r-3:14px;

  /* —— 动效（§2.4） —— */
  --dur-state:220ms;
  --dur-hover:160ms;
  --ease-state:cubic-bezier(.22,.61,.36,1);

  /* —— 描边统一 —— */
  --line:rgba(212,168,83,.18);
  --line-strong:rgba(212,168,83,.32);
}

body{background:var(--abyss-1);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-1);line-height:1.6}
/*APP_LAYOUT*/

/* 顶部 */
.header{padding:22.0px 16.0px 12.0px;text-align:center;background:linear-gradient(180deg,var(--abyss-3),var(--abyss-2))}
.header h1{font-size:20.0px;color:var(--gold-3);letter-spacing:4.0px;font-weight:500}
.header p{font-size:12.0px;color:var(--ink-3);margin-top:4.0px}

.container{padding:0 4px 40px}

/* 卡片 */
.card{background:var(--abyss-2);border:0.5px solid rgba(212,168,83,.18);border-radius:12.0px;padding:16.0px;margin-bottom:12.0px}
.card-title{font-size:16.0px;color:var(--gold-3);font-weight:500;letter-spacing:2.0px;margin-bottom:12.0px;display:flex;align-items:center}
.card-title-line{flex:1;height:1px;margin-left:10.0px;background:linear-gradient(90deg,rgba(212,168,83,.3),transparent)}

/* 表单 */
.form-item{margin-bottom:16.0px}
.form-label{font-size:13.0px;color:var(--ink-3);margin-bottom:8.0px;letter-spacing:1.0px;display:block}
.input,.picker{width:100%;background:var(--abyss-3);border:0.5px solid rgba(212,168,83,.2);border-radius:7.0px;padding:12.0px;font-size:15.0px;color:var(--ink-1);outline:none;font-family:inherit}
.input:focus{border-color:rgba(212,168,83,.5)}
.picker{cursor:pointer;display:flex;justify-content:space-between;align-items:center}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 12.0px) 50%,calc(100% - 8.0px) 50%;background-size:4.0px 4.0px;background-repeat:no-repeat}
.gender-switch{display:flex}
.gender-item{flex:1;text-align:center;padding:12.0px 0;background:var(--abyss-3);border:0.5px solid rgba(212,168,83,.2);border-radius:7.0px;font-size:15.0px;color:var(--ink-3);cursor:pointer}
.gender-item+.gender-item{margin-left:12.0px}
.gender-item.active{background:rgba(194,58,46,.2);border-color:var(--cinnabar);color:#f0d9a8}

/* 按钮 */
.btn-primary{width:100%;background:linear-gradient(135deg,var(--cinnabar),#a02a20);color:var(--gold-4);border:none;border-radius:499.5px;padding:14.0px 0;text-align:center;font-size:16.0px;letter-spacing:4.0px;cursor:pointer;box-shadow:0 3.0px 12.0px rgba(194,58,46,.3)}
.btn-primary:active{opacity:.85}
.btn-ghost{width:100%;background:transparent;color:var(--gold-3);border:0.5px solid rgba(212,168,83,.4);border-radius:499.5px;padding:10.0px 0;text-align:center;font-size:14.0px;letter-spacing:2.0px;cursor:pointer;margin-top:8.0px}

/* 摘要 */
.summary-name{font-size:18.0px;color:var(--gold-3);font-weight:500}
.summary-gender{font-size:12.0px;color:var(--ink-3);margin-left:6.0px}
.summary-info{font-size:13.0px;color:var(--ink-2);margin-top:4.0px}
.summary-info.sub{font-size:12.0px;color:var(--ink-4)}
.dot{margin:0 4.0px;color:var(--ink-4)}

/* 四柱 */
.pillars{display:flex;justify-content:space-between;align-items:flex-start}
.pillar{flex:1;text-align:center}
.pillar-label{font-size:11.0px;color:var(--ink-3);margin-bottom:6.0px}
.ganzhi{line-height:1.3;margin-bottom:4.0px}
.gan{font-size:22.0px;font-weight:500;display:block}
.zhi{font-size:18.0px;display:block}
.shishen{font-size:11.0px;color:var(--ink-2);padding:2.0px 4.0px;border-radius:3.0px;display:inline-block;margin-bottom:4.0px}
.shishen-day{background:rgba(212,168,83,.18);color:var(--gold-3)}
.hidden-line{height:1px;background:rgba(255,255,255,.06);margin:4.0px 6.0px}
.hide-item{font-size:10.0px;line-height:1.6}
.hide-gan{margin-right:3.0px;font-weight:500}
.hide-ss{color:var(--ink-3)}
.nayin{font-size:10.0px;color:var(--ink-4);margin-top:4.0px}

/* 行 */
.row{display:flex;justify-content:space-between;align-items:center;padding:7.0px 0}
.row-label{font-size:13.0px;color:var(--ink-3)}
.row-value{font-size:15.0px;color:var(--ink-1)}
.day-gan{font-size:18.0px;font-weight:500;margin-right:4.0px}
.strong-true .row-value{color:var(--gold-3)}
.strong-false .row-value{color:#c9a0a0}

/* 进度条 */
.wx-item{display:flex;align-items:center;margin-bottom:9.0px}
.wx-name{width:30.0px;font-size:15.0px;font-weight:500}
.progress{flex:1;height:6.0px;background:var(--abyss-3);border-radius:3.0px;overflow:hidden;margin:0 8.0px}
.progress-inner{height:100%;border-radius:3.0px}
.wx-percent{width:35.0px;text-align:right;font-size:12.0px;color:var(--ink-3)}
.wx-note{margin-top:8.0px;padding:8.0px;background:rgba(212,168,83,.08);border-radius:6.0px;font-size:12.0px;color:var(--ink-2)}

/* 标签 */
.yongshen-row{display:flex;align-items:flex-start;margin-bottom:8.0px}
.yongshen-label{width:40.0px;font-size:13.0px;color:var(--ink-3);flex-shrink:0;padding-top:3.0px}
.yongshen-values{flex:1;display:flex;flex-wrap:wrap}
.tag{display:inline-block;padding:3.0px 9.0px;border-radius:4.0px;font-size:11.0px;margin:0 6.0px 4.0px 0}
.tag-ji{background:rgba(194,58,46,.18);color:var(--cinnabar-hi);border:0.5px solid rgba(194,58,46,.35)}
.tag-xi{background:rgba(212,168,83,.15);color:var(--gold-3);border:0.5px solid rgba(212,168,83,.35)}

/* 提示 */
.reason-box{margin-top:8.0px;padding:10.0px;background:var(--abyss-3);border-radius:7.0px}
.reason-item{font-size:12.0px;color:var(--ink-2);line-height:1.8}
.reason-advice{font-size:12.0px;color:var(--gold-3);line-height:1.8;margin-top:6.0px}
.note-item{font-size:12.0px;color:var(--ink-3);line-height:1.8;margin-top:4.0px}

/* 大运 */
.yun-header{font-size:13.0px;color:var(--ink-3);margin-bottom:10.0px}
.yun-list{display:flex;flex-wrap:wrap}
.yun-item{width:33.33%;text-align:center;padding:8.0px 2.0px;border-radius:6.0px;margin-bottom:4.0px}
.yun-item.current{background:rgba(212,168,83,.12);border:0.5px solid rgba(212,168,83,.3)}
.yun-age{font-size:10.0px;color:var(--ink-4)}
.yun-ganzhi{font-size:16.0px;font-weight:500;margin:2.0px 0}
.yun-year{font-size:10.0px;color:var(--ink-4)}

/* 运势卡 */
.fortune-hero{text-align:center;padding:12.0px 0}
.fortune-date{font-size:14.0px;color:var(--ink-2)}
.fortune-gz{font-size:26.0px;font-weight:500;margin:6.0px 0;letter-spacing:3.0px}
.fortune-ss{font-size:13.0px;color:var(--gold-3);letter-spacing:2.0px}
.fortune-cards{display:flex;flex-wrap:wrap}
.fcard{width:48%;border-radius:8.0px;padding:10.0px;margin:0 4% 8.0px 0;text-align:center}
.fcard:nth-child(2n){margin-right:0}
.fcard-icon{width:26.0px;height:26.0px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 6.0px;font-size:13.0px;color:var(--on-gold);font-weight:500}
.fcard-title{font-size:13.0px;color:var(--ink-3)}
.fcard-stars{font-size:13.0px;letter-spacing:2.0px;margin:4.0px 0}
.fcard-score{font-size:22.0px;font-weight:500}
.fcard-label{font-size:11.0px;color:var(--ink-4)}
.fcard-text{font-size:12.0px;color:var(--ink-2);line-height:1.7;margin-top:6.0px;text-align:left}

.danger-card{border-radius:8.0px;padding:12.0px;margin-top:4.0px}
.danger-high{background:rgba(194,58,46,.12);border:0.5px solid rgba(194,58,46,.3)}
.danger-mid{background:rgba(212,168,83,.1);border:0.5px solid rgba(212,168,83,.25)}
.danger-low{background:rgba(74,124,89,.1);border:0.5px solid rgba(74,124,89,.25)}
.danger-level{font-size:13.0px;font-weight:500;margin-bottom:4.0px}
.danger-text{font-size:12.5px;color:#c9c4b8;line-height:1.8}
.danger-advice{font-size:12.0px;color:var(--ink-3);margin-top:6.0px;line-height:1.7}

/* 宜忌 */
.yiji{display:flex;margin-top:6.0px}
.yiji-col{flex:1}
.yiji-col+.yiji-col{margin-left:10.0px}
.yiji-label{font-size:13.0px;font-weight:500;margin-bottom:6.0px}
.yiji-label.yi{color:var(--cinnabar-hi)}
.yiji-label.ji{color:#7a9b8a}
.yiji-item{font-size:12.0px;color:var(--ink-2);line-height:1.9}

/* 【1.8.3】宜忌日期标注与命主关联解读的样式 */
.yiji-when{
  font-size:11.5px;color:var(--ink-3);line-height:1.8;
  margin-bottom:9px;padding:6px 10px;border-radius:7px;
  background:rgba(255,255,255,.03);
  border-left:2px solid rgba(212,168,83,.35);
}
.yiji-when b{color:#c0baac;font-weight:600}
.yiji-why{font-size:10.5px;color:var(--ink-3);letter-spacing:0}

/* 【1.8.4】前后半生：判定依据三指标 */
.half-risk{margin:7px 0 9px}
.hr-row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;color:var(--ink-3);line-height:1.75}
.hr-row b{color:var(--gold-3);font-size:12.5px;font-weight:600}
.hr-note{font-size:10px;color:var(--ink-4);margin-top:2px;letter-spacing:.3px}
.zs-para-dim{font-size:11.5px;color:var(--ink-3);line-height:1.85}

/* 日历 */
/* 【1.8.0】节气插画底图层：
 * 作为 .cal-card 的第一个子元素，position:absolute 铺满整卡。
 * 【真实缺陷 · 已修】原先把卡片背景不透明（var(--abyss-2)）留在 canvas 之下，
 * 结果插画被整块卡片背景盖住，完全看不见。
 * 现改为：canvas 用 z-index:0，卡片自身背景保持不变，
 * 但通过「卡片背景半透明化 + canvas 在上」的方式让插画透出：
 *   .cal-card 背景改为更暗且半透明 → canvas 画在上面 → 格子再画在 canvas 上。
 * 三层顺序：卡片底 < 节气插画(0) < 文字与格子(1) < 徽标(2)。
 * pointer-events:none 确保插画绝不拦截点击，日期格子照常可点。 */
/* 【1.8.1】卡片背景改为半透明，让满铺插画整层透出 */
.cal-card{position:relative;overflow:hidden;background:rgba(18,19,38,.42)}
/* 【1.8.1】节气场景插画：满铺整卡（inset:0 铺满，不再只画中央一小块）。
 * pointer-events:none 保证绝不拦截日期点击；
 * 背景与场景本身已按「底图」定位（低饱和+ 中低透明度），
 * 叠在其上的日期数字与吉凶色块仍保持可读。*/
.cal-jieqi-art{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
  opacity:1;
}
.cal-card > *:not(.cal-jieqi-art){position:relative;z-index:1}
/* 节气徽标：放在卡片底部说明区上方，与月份标题不冲突 */
.cal-jieqi-tag{
  display:inline-flex;align-items:center;gap:6px;
  margin:0 0 10px;padding:3px 10px;border-radius:11px;
  background:rgba(10,12,28,.62);
  border:0.5px solid rgba(212,168,83,.34);
  font-size:11px;color:#e0cf9a;letter-spacing:1px;
  pointer-events:none;
  max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.cal-jieqi-tag .jq-ico{font-size:12px;opacity:.95}
.cal-jieqi-tag .jq-hint{color:#a49d8b;letter-spacing:0}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12.0px}
.cal-nav{width:30.0px;height:30.0px;line-height:28.0px;text-align:center;font-size:20.0px;color:var(--gold-3);cursor:pointer;user-select:none}
.cal-title{font-size:16.0px;color:var(--gold-3);letter-spacing:1.0px}
.cal-week{display:flex;margin-bottom:4.0px}
.cal-week-item{flex:1;text-align:center;font-size:12.0px;color:var(--ink-3);padding:6.0px 0}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;width:100%;
}
.cal-blank{height:58px}
.cal-day{
  height:58px;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border-radius:6px;
  transition:all .18s;
  border:1px solid transparent;
}
.cal-day:hover{transform:scale(1.08);border-color:rgba(212,168,83,.5);z-index:2}
.cd-day{font-size:14.0px;color:var(--ink-1)}
.cd-score{font-size:9.0px;color:var(--ink-4)}
.cal-day.lv-ji{background:rgba(194,58,46,.3)!important;border-color:rgba(224,136,120,.6)!important;color:#ffdcd4}
.cal-day.lv-xiong{background:rgba(74,124,89,.3)!important;border-color:rgba(122,171,138,.6)!important;color:#d0e8d8}
.cal-day.lv-ping{background:rgba(255,255,255,.02)!important;border-color:rgba(255,255,255,.05)!important}
.cal-day .cd-day{font-size:15px;font-weight:500;line-height:1.2}
.cal-day .cd-lv{display:inline-block;font-size:10px;line-height:1;margin-top:2px;padding:1px 4px;border-radius:3px}
.cal-day.lv-ji .cd-lv{background:rgba(224,136,120,.25);color:var(--cinnabar-hi)}
.cal-day.lv-xiong .cd-lv{background:rgba(122,171,138,.25);color:#7aab8a}
.cal-day.lv-ping .cd-lv{background:rgba(255,255,255,.06);color:var(--ink-4)}
.cal-day .cd-score{font-size:9px;line-height:1.2;opacity:.9}
.cal-day.today{outline:1.0px solid var(--gold-3)}
.cal-day.selected{outline:1.0px solid var(--cinnabar)}

/* 弹层 */
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.detail-panel{background:var(--abyss-2);border-radius:20px;padding:28px 32px;max-height:84vh;overflow-y:auto;width:100%;max-width:880px;border:1px solid rgba(212,168,83,.25)}
.dp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12.0px}
.dp-date{font-size:16.0px;color:var(--gold-3)}
.dp-close{width:28.0px;height:28.0px;line-height:26.0px;text-align:center;font-size:16.0px;color:var(--ink-3);cursor:pointer;border:0.5px solid rgba(212,168,83,.2);border-radius:50%}
.dp-scores{display:flex;margin-bottom:12.0px}
.dp-score-item{flex:1;text-align:center}
.dp-score-num{font-size:18.0px;font-weight:500}
.dp-score-label{font-size:11.0px;color:var(--ink-4);margin-top:2.0px}
.dp-block{margin-bottom:10.0px}
.dp-block-title{font-size:12.0px;color:var(--gold-3);margin-bottom:4.0px}
.dp-block-text{font-size:12.5px;color:var(--ink-2);line-height:1.8}


/* ============ 农历输入 ============ */
.lunar-tag{display:inline-block;margin-left:10px;padding:1px 10px;font-size:12px;color:var(--gold-3);background:rgba(212,168,83,.15);border:1px solid rgba(212,168,83,.35);border-radius:5px;letter-spacing:1px}
.lunar-row{display:flex;align-items:center;background:var(--abyss-3);border:1px solid rgba(212,168,83,.2);border-radius:7.0px;padding:10px 14px;transition:border-color .25s,box-shadow .25s}
.lunar-row:hover{border-color:rgba(212,168,83,.5);box-shadow:0 0 0 3px rgba(212,168,83,.07)}
.lunar-cell{display:flex;align-items:baseline;flex:1;min-width:0}
.lunar-y{flex:1.4}
.lunar-input{flex:1;min-width:0;height:36px;font-size:22px;color:var(--gold-4);text-align:center;font-weight:500;background:transparent;border:none;outline:none;font-family:inherit}
.lunar-unit{font-size:14px;color:var(--ink-3);margin-left:3px}
.lunar-sep{color:var(--ink-4);font-size:18px;padding:0 5px}
.leap-toggle{width:38px;height:38px;font-size:14px;border-radius:9px;margin-left:10px;flex-shrink:0;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);color:var(--ink-4)}
.leap-toggle:hover{border-color:rgba(212,168,83,.45);color:var(--gold-3);transform:scale(1.06)}
.leap-on{background:var(--gold-3);border-color:var(--gold-3);color:var(--on-gold);font-weight:500}
.lunar-preview{margin-top:12px;font-size:14px;color:var(--gold-3);line-height:1.7;min-height:24px}
.lunar-hint{margin-top:3px;font-size:12px;color:var(--ink-4)}
.month-grid{display:flex;flex-wrap:wrap;margin-top:12px;gap:8px}

body{overflow-x:hidden}

.app{display:flex;min-height:100vh;background:var(--abyss-1);max-width:none}
/* 【1.9.0】防横向溢出：min-width:0 是 flex 子项可收缩的关键，
 * 缺失时内部固定宽元素会撑破容器。*/
.main,.card,.page{min-width:0}

/* ---------- 左侧导航 ---------- */
.sidebar{
  width:216px;flex-shrink:0;
  background:linear-gradient(180deg,var(--abyss-3),#181825);
  border-right:1px solid rgba(212,168,83,.14);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}

.brand{display:flex;align-items:center;gap:12px;padding:26px 20px 22px;border-bottom:1px solid rgba(255,255,255,.05)}
.brand-mark{
  width:42px;height:42px;flex-shrink:0;border-radius:12px;
  background:linear-gradient(135deg,rgba(212,168,83,.25),rgba(212,168,83,.08));
  border:1px solid rgba(212,168,83,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--gold-3);
}
.brand-text h1{font-size:19px;color:var(--gold-3);letter-spacing:3px;font-weight:500;line-height:1.2}
.brand-text p{font-size:11px;color:var(--ink-4);letter-spacing:1px;margin-top:2px}

.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 14px;border-radius:10px;
  font-size:15px;color:var(--ink-3);cursor:pointer;
  border-left:2px solid transparent;
  transition:all .2s;
  user-select:none;
}
.nav-item:hover{background:rgba(212,168,83,.07);color:var(--gold-3);transform:translateX(3px)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(212,168,83,.16),rgba(212,168,83,.04));
  color:var(--gold-3);border-left-color:var(--gold-3);font-weight:500;
}
.nav-ico{
  width:22px;height:22px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;border-radius:6px;
  background:rgba(255,255,255,.05);
}

.sidebar-foot{padding:16px 20px 20px;border-top:1px solid rgba(255,255,255,.05)}
.foot-title{font-size:11px;color:var(--ink-4);letter-spacing:2px}

.foot-note{font-size:11px;color:var(--ink-4)}

  margin-top:10px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:center;
  font-size:11.5px;color:var(--gold-3);letter-spacing:.5px;
  background:rgba(212,168,83,.12);border:1px solid rgba(212,168,83,.32);
  transition:background .2s;
}
.foot-cta:hover{background:rgba(212,168,83,.22)}

/* ---------- 右侧主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.main-head{
  padding:26px 36px 18px;
  border-bottom:1px solid rgba(255,255,255,.05);
  background:var(--abyss-1);
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(8px);
}
.page-title{font-size:24px;color:var(--gold-3);letter-spacing:3px;font-weight:500}
.page-sub{font-size:13px;color:var(--ink-4);margin-top:4px;line-height:1.6}

.container{
  padding:22px 36px 48px;
  max-width:1180px;width:100%;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;align-content:start;
}
.container > .card,
.container > .half-row,
.container > .overview-card{margin-bottom:0}
.container > .btn-ghost,
.container > .btn-primary{grid-column:1/-1}

/* 宽屏三列（超宽显示器） */
@media (min-width:1500px){
  .container{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pillar{font-size:20px}
}

/* 卡片在网格中自适应 */
.card{
  margin-bottom:0;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(212,168,83,.4);
  box-shadow:0 10px 32px rgba(0,0,0,.4);
}

/* 单栏元素（表单、需要整宽的） */

.yr-gz{font-size:26px}
.yr-left{width:104px}

/* 运势四维卡：横版四列排布更整齐 */
.container > .card.fortune-card{grid-column:1/-1}
.fortune-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fcard{width:auto;margin:0;padding:18px 16px;text-align:left;display:flex;flex-direction:column}
.fcard-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.fcard-title{font-size:14px;color:var(--ink-3)}
.fcard-stars{font-size:13px;letter-spacing:1px;margin:0;flex:1}
.fcard-body{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.fcard-score{font-size:30px;font-weight:500;line-height:1}
.fcard-label{font-size:11px;color:var(--ink-4)}
.fcard-text{font-size:13px;color:var(--ink-2);line-height:1.85;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);flex:1}
@media (max-width:1240px){.fortune-cards{grid-template-columns:repeat(2,1fr)}}

/* 日历：横版七列更宽 */
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-week-item{text-align:center;font-size:12px;color:var(--ink-3);padding:8px 0}
.cal-card{grid-column:1/-1;max-width:560px;width:100%;margin:0 auto}
.cal-week-item{padding:8px 0}

/* 弹层居中 */
.mask{align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.detail-panel{border-radius:20px;padding:28px 32px;max-width:880px;max-height:84vh;overflow-y:auto}

/* 窄屏回退为单栏
 * 【1.9.0 修复】原实现缺少 `min-width:0` 与 `overflow-x:hidden`，
 * 而 .msum-s等元素带 min-width:200px，在 880/768 宽度下把
 * 文档撑到 941px —— 实测产生 94~206px 横向滚动。
 * 修正：单列时给 .main 明确的 min-width:0，并允许内部 flex 项收缩。*/
@media (max-width:900px){
  .app{flex-direction:column;max-width:100vw;overflow-x:hidden}
  .main{min-width:0;width:100%;max-width:100vw;overflow-x:hidden}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:0 12px;gap:8px}
  .brand{border-bottom:none;padding:12px 8px}
  .nav{flex-direction:row;padding:0;flex:1;flex-wrap:wrap;gap:4px}
  .nav-item{padding:7px 11px;font-size:13px;border-left:none;border-bottom:2px solid transparent;border-radius:8px}
  .nav-item.active{border-left:none;border-bottom-color:var(--gold-3)}
  .nav-ico{display:none}
  .sidebar-foot{display:none}
  .main-head{padding:18px 20px 14px}
  .container{padding:16px 20px 32px;grid-template-columns:1fr}
  .fortune-cards{grid-template-columns:repeat(2,1fr)}
}

/* ============================================================
   铜钱掷骰台
   ============================================================ */
.coin-stage{
  margin:20px 0 16px;padding:26px 20px 20px;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,168,83,.1),transparent 70%);

}
.coin-bowl{position:relative;height:104px;display:flex;align-items:flex-end;justify-content:center}
.bowl-rim{

  border:2px solid rgba(212,168,83,.6);
  position:absolute;bottom:26px;z-index:3;
}
.bowl-body{
  width:112px;height:52px;
  background:linear-gradient(180deg,rgba(140,105,50,.35),rgba(90,68,32,.2));
  border:2px solid rgba(212,168,83,.4);border-top:none;

  position:absolute;bottom:0;z-index:2;
}
.coins{display:flex;gap:10px;z-index:4;position:relative;align-items:flex-end;padding-bottom:8px}
.coin{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#e8d4a0,#b8944a 60%,#8a6c30);
  border:2px solid #6d5424;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#5a4218;font-weight:600;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
  opacity:.35;transform:scale(.86);
  transition:opacity .2s, transform .2s;
}
.coin.show{opacity:1;transform:scale(1)}
.coin.face-front{background:radial-gradient(circle at 34% 30%,#f0dcae,#c2a05a 60%,#94742f)}
.coin.face-back{background:radial-gradient(circle at 34% 30%,#d8c48c,#a88a44 60%,#7d6028)}

/* 掷出动画 */
.coin-stage.rolling .coin{animation:tumble .62s ease-in-out}
.coin-stage.rolling .coin[data-i="1"]{animation-delay:.05s}
.coin-stage.rolling .coin[data-i="2"]{animation-delay:.1s}
@keyframes tumble{
  0%{transform:translateY(-42px) rotate(0deg) scale(.8);opacity:.2}
  55%{transform:translateY(4px) rotate(300deg) scale(1.08);opacity:1}
  100%{transform:translateY(0) rotate(360deg) scale(1);opacity:1}
}
.coin-stage.rolling .bowl-body{animation:shake .62s ease-in-out}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}
}
.coin-hint{margin-top:14px;font-size:13px;color:var(--ink-2);line-height:1.8;min-height:22px}

.gh-method{margin-top:10px;font-size:12px;color:var(--ink-3);padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px;display:inline-block;line-height:1.8}
.cast-sound{float:right;background:rgba(212,168,83,.1);border:1px solid rgba(212,168,83,.3);border-radius:18px;color:#e2c784;padding:5px 12px;cursor:pointer;font-size:12px}

.cf-halo{position:absolute;width:min(75vw,70vh);aspect-ratio:1;border-radius:50%;border:1px solid #d5b56877;box-shadow:0 0 0 30px #c6a4590b,0 0 100px #bd8b4b44,inset 0 0 90px #c6a45922;animation:cfPulse 1.4s ease-in-out infinite alternate}
.cf-label{z-index:1;margin-top:35px;font:600 clamp(24px,4vw,44px) "STKaiti","KaiTi",serif;letter-spacing:.2em;text-shadow:0 0 30px #e6b96b}
.cf-note{z-index:1;margin-top:12px;font-size:13px;letter-spacing:.16em;color:#c8c8d4}
.cf-coinset{z-index:1;display:flex;gap:clamp(15px,4vw,48px);perspective:800px}
.cf-coin{display:grid;place-items:center;width:clamp(68px,9vw,110px);aspect-ratio:1;border-radius:50%;font:600 33px "STKaiti","KaiTi",serif;color:#694617;border:8px double #7e5825;background:radial-gradient(circle at 35% 25%,#fff1bd,#c69840 48%,#6f491b 85%);box-shadow:inset 0 0 13px #473010,0 0 30px #e3b76388;animation:cfToss 1.14s cubic-bezier(.17,.67,.33,1) both;animation-delay:calc(var(--i)*.08s)}
.cf-yaos{z-index:1;display:flex;flex-direction:column-reverse;gap:11px}.cf-yaos i{display:block;width:190px;height:13px;border-radius:9px;background:linear-gradient(90deg,#92671e,#fff2b4,#92671e);box-shadow:0 0 18px #efcb7a;animation:cfYao .7s both;animation-delay:calc(var(--i)*.13s)}
.cf-stars{position:relative;width:300px;height:250px;z-index:1}.cf-stars i{position:absolute;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:#e6c26a;color:#34240d;font:28px "KaiTi",serif;box-shadow:0 0 42px #f2dba3;animation:cfConverge 1.3s cubic-bezier(.2,.8,.3,1) both}.cf-stars i:nth-child(1){--x:-110px;--y:60px;left:120px;top:95px}.cf-stars i:nth-child(2){--x:110px;--y:60px;left:120px;top:95px;animation-delay:.12s}.cf-stars i:nth-child(3){--x:0px;--y:-95px;left:120px;top:95px;animation-delay:.24s}.cf-stars b{position:absolute;left:132px;top:95px;font-size:68px;opacity:0;animation:cfBirth .8s .7s both}
.cf-time{position:relative;width:260px;height:260px;z-index:1}.cf-time i{position:absolute;inset:0;border:2px dashed #efd699;border-radius:50%;box-shadow:0 0 24px #e3b66b;animation:cfClock 1.25s ease-out both}.cf-time i:nth-child(2){inset:27px;border-style:solid;animation-direction:reverse}.cf-time i:nth-child(3){inset:57px;border-color:#9fcbe0}.cf-time b{position:absolute;inset:0;display:grid;place-items:center;font:64px "KaiTi",serif;text-shadow:0 0 28px #ffd789}
@keyframes cfPulse{to{transform:scale(1.08);opacity:.65}}@keyframes cfToss{0%{transform:translateY(190px) rotateY(0deg) scale(.65);opacity:0}55%{transform:translateY(-65px) rotateY(1100deg) scale(1.1);opacity:1}100%{transform:translateY(0) rotateY(1440deg) scale(1)}}@keyframes cfYao{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}@keyframes cfConverge{from{opacity:0;transform:translate(var(--x),var(--y)) scale(.5)}to{opacity:1;transform:translate(0,0)}}@keyframes cfBirth{from{opacity:0;transform:scale(.1) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes cfClock{from{transform:rotate(-300deg) scale(.7);opacity:.15}to{transform:rotate(0) scale(1);opacity:1}}

.howto > summary{
  padding:13px 16px;cursor:pointer;list-style:none;
  font-size:13.5px;color:var(--gold-3);letter-spacing:1px;
  display:flex;align-items:center;justify-content:space-between;
}
.howto > summary::-webkit-details-marker{display:none}
.howto > summary::after{content:'展开 ▾';font-size:11px;color:var(--ink-3)}
.howto[open] > summary::after{content:'收起 ▴'}
.howto-body{padding:0 16px 16px;border-top:1px dashed rgba(212,168,83,.16)}
.howto-tip{font-size:12px;color:var(--ink-3);line-height:1.9;padding:11px 0}
.howto-method{padding:13px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.howto-method:last-child{border-bottom:none}
.howto-m-h{font-size:13px;color:#e8e2d6;margin-bottom:7px;letter-spacing:.5px}
.howto-m-s{font-size:13px;line-height:2;color:#b8b2a6}
.howto-m-n{font-size:12px;line-height:1.9;color:var(--gold-3);margin-top:7px;padding-left:11px;border-left:2px solid rgba(212,168,83,.4)}
.howto-formula{
  margin-top:9px;padding:11px 13px;border-radius:9px;
  background:rgba(0,0,0,.22);font-size:12px;line-height:2;
  color:var(--ink-2);font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-all;
}
.howto-tag{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:rgba(212,168,83,.18);color:var(--gold-3);margin-left:7px;vertical-align:middle;
}
.howto-tag.conv{background:rgba(120,160,220,.16);color:#8fb4e0}
.msum{
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  margin:14px 0 0;padding:11px 14px;border-radius:10px;
  background:rgba(212,168,83,.07);border:1px solid rgba(212,168,83,.16);
  font-size:12.5px;color:var(--ink-2);line-height:1.9;
}
.msum-t{color:var(--gold-3);font-weight:500;letter-spacing:.5px;flex-shrink:0}
.msum-s{flex:1;min-width:200px}

/* ---- 六轮掷钱 ---- */
.round-stage{margin:18px 0}
.round-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 15px;border-radius:11px;background:rgba(212,168,83,.08);
  font-size:13px;color:var(--gold-3);margin-bottom:14px;
}
.round-head .rh-right{font-size:12px;color:var(--ink-3)}
.round-btn{
  width:100%;padding:15px;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold-3),#b8944a);border:none;
  color:var(--on-gold);font-size:15px;font-weight:600;font-family:inherit;
  letter-spacing:2px;transition:all .2s;
}
.round-btn:hover:not(:disabled){filter:brightness(1.08)}
.round-btn:disabled{background:#2a2a3c;color:#5f5a52;cursor:not-allowed;letter-spacing:1px}
.round-actions{display:flex;gap:9px;margin-top:11px}
.round-actions button{
  flex:1;padding:11px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:var(--ink-2);font-size:12.5px;font-family:inherit;transition:all .2s;
}
.round-actions button:hover:not(:disabled){background:rgba(212,168,83,.12);color:var(--gold-3)}
.round-actions button:disabled{opacity:.4;cursor:not-allowed}
.round-list{margin-bottom:14px}
.round-item{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;border-radius:8px;margin-bottom:5px;
  background:rgba(255,255,255,.03);font-size:12.5px;color:var(--ink-3);
}
.round-item.done{background:rgba(212,168,83,.07);color:#ddd8ce}
.round-item .ri-pos{width:44px;color:var(--gold-3);font-weight:500}
.round-item .ri-faces{display:flex;gap:5px}
.round-item .ri-face{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#5a4218;font-weight:600;
  background:radial-gradient(circle at 34% 30%,#e8d4a0,#b8944a 60%,#8a6c30);
  border:1px solid #6d5424;
}
.round-item .ri-face.yang{background:radial-gradient(circle at 34% 30%,#f0dcae,#c2a05a 60%,#94742f)}
.round-item .ri-sum{color:var(--gold-3)}
.round-item .ri-val{flex:1;text-align:right}
.round-item .ri-val.changing{color:#e08a6a;font-weight:600}
.round-empty{padding:22px;text-align:center;font-size:12.5px;color:#5f5a52;line-height:2}
.draft-bar{
  display:flex;gap:9px;padding:12px 14px;margin:14px 0;border-radius:11px;
  background:rgba(220,160,90,.12);border:1px solid rgba(220,160,90,.35);
  font-size:12.5px;color:#e0b070;line-height:1.85;flex-wrap:wrap;align-items:center;
}
.draft-bar .db-btns{display:flex;gap:8px;margin-left:auto}
.draft-bar button{
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12px;font-family:inherit;
  background:rgba(212,168,83,.2);border:1px solid rgba(212,168,83,.45);color:var(--gold-3);
}
.draft-bar button.ghost{background:transparent;border-color:rgba(255,255,255,.15);color:var(--ink-3)}

/* ---- 结果页操作区 ---- */
.res-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.res-actions button{
  padding:14px;border-radius:11px;cursor:pointer;font-size:13.5px;font-family:inherit;
  transition:all .2s;letter-spacing:.5px;
}
.res-actions .ra-save{background:rgba(212,168,83,.16);border:1px solid rgba(212,168,83,.45);color:var(--gold-3)}
.res-actions .ra-save:hover{background:rgba(212,168,83,.26)}
.res-actions .ra-newq{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#b8b2a6}
.res-actions .ra-newq:hover{background:rgba(212,168,83,.12);color:var(--gold-3)}
.res-actions .ra-newp{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);color:var(--ink-3)}
.res-actions .ra-newp:hover{background:rgba(212,168,83,.1);color:var(--gold-3)}
.ra-note{font-size:11.5px;color:#5f5a52;line-height:1.85;padding:0 3px}

/* ---- 输入区 ---- */
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q-advice{
  margin-top:9px;padding:11px 13px;border-radius:9px;
  background:rgba(220,160,90,.1);border-left:3px solid rgba(220,160,90,.5);
  font-size:12.5px;color:#e0b070;line-height:1.9;
}
.q-advice .qa-t{font-weight:600;margin-bottom:4px}

/* ---- 铜钱原始记录 / 卦象图 ---- */
.coin-raw{margin-top:12px;padding:13px 15px;border-radius:11px;background:rgba(0,0,0,.2)}
.coin-raw-t{font-size:12px;color:var(--gold-3);margin-bottom:9px;letter-spacing:1px}
.coin-raw-row{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:12px;color:var(--ink-2)}
.coin-raw-row .crr-pos{width:42px;color:var(--ink-3)}
.coin-raw-row .crr-coins{display:flex;gap:4px}
.coin-raw-row .crr-coin{
  width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:600;color:#5a4218;
  background:radial-gradient(circle at 34% 30%,#e8d4a0,#b8944a 60%,#8a6c30);border:1px solid #6d5424;
}
.coin-raw-row .crr-coin.yang{background:radial-gradient(circle at 34% 30%,#f0dcae,#c2a05a 60%,#94742f)}
.order-note{
  margin-top:9px;font-size:11.5px;color:var(--ink-3);line-height:1.85;
  padding:8px 11px;border-radius:8px;background:rgba(255,255,255,.03);
}
.order-note b{color:var(--gold-3);font-weight:500}
.gua-diagram{margin:6px 0}
.gua-diagram .gd-row{
  display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:7px;
  font-size:12.5px;color:var(--ink-2);
}
.gua-diagram .gd-row.moving{background:rgba(212,168,83,.09);color:#ddd8ce}
.gua-diagram .gd-pos{width:38px;color:var(--ink-3)}
.gua-diagram .gd-line{letter-spacing:2px;font-size:15px;color:var(--gold-3);min-width:52px}
.gua-diagram .gd-line.yin{color:#7a8fa8}
.gua-diagram .gd-meta{flex:1;font-size:11.5px;color:var(--ink-3)}
.gua-diagram .gd-tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(220,140,90,.2);color:#e0a070}
.hex-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px}
.hex-meta .hm-item{padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.035)}
.hex-meta .hm-k{font-size:11px;color:var(--ink-3);margin-bottom:3px}
.hex-meta .hm-v{font-size:12.5px;color:#ddd8ce;word-break:break-all;line-height:1.7}

/* ---- 合盘农历录入 ---- */
.cal-switch{display:flex;gap:0;margin-bottom:14px;border-radius:9px;overflow:hidden;border:1px solid rgba(212,168,83,.25);width:fit-content}
.cal-switch button{
  padding:8px 20px;font-size:12.5px;cursor:pointer;font-family:inherit;
  background:transparent;border:none;color:var(--ink-3);transition:all .2s;
}
.cal-switch button.on{background:var(--gold-3);color:var(--on-gold);font-weight:600}
.lunar-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.lunar-pick select{
  width:100%;padding:9px 6px;border-radius:9px;font-size:12.5px;font-family:inherit;
  background:var(--abyss-3);border:1px solid rgba(212,168,83,.2);color:#ddd8ce;
}
.leap-switch{
  display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:9px;
  background:rgba(255,255,255,.035);font-size:12.5px;color:var(--ink-2);margin-bottom:9px;
}
.leap-switch input{width:16px;height:16px;accent-color:var(--gold-3);cursor:pointer}
.leap-switch.disabled{opacity:.45}
.leap-switch .ls-note{margin-left:auto;font-size:11px;color:#5f5a52}
.conv-preview{
  padding:11px 13px;border-radius:9px;background:rgba(212,168,83,.09);
  font-size:12.5px;color:var(--gold-3);line-height:1.9;word-break:break-all;
}
.conv-preview.err{background:rgba(224,120,90,.13);color:#e08a6a}
.bp-pair{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:12px}
.bp-item{padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.035)}
.bp-item .bp-k{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.bp-item .bp-v{font-size:13px;color:#ddd8ce;line-height:1.75;word-break:break-all}
.bp-warn{font-size:11.5px;color:#e0b070;margin-top:9px;line-height:1.85}

/* ---- 九宫约定披露 ---- */
.conv-box{margin-top:14px;padding:14px 16px;border-radius:11px;background:rgba(120,160,220,.07);border:1px solid rgba(120,160,220,.22)}
.conv-box .cb-t{font-size:12.5px;color:#8fb4e0;margin-bottom:10px;letter-spacing:1px}
.conv-box .cb-row{font-size:12px;color:var(--ink-2);line-height:1.95;margin-bottom:8px}
.conv-box .cb-row b{color:#8fb4e0;font-weight:500}
.conv-box .cb-diff{font-size:12px;color:var(--gold-3);line-height:1.95;padding-top:9px;border-top:1px dashed rgba(120,160,220,.25)}

@media (max-width:640px){
  .form-row2,.dg-pair,.bp-pair,.hex-meta{grid-template-columns:1fr}
  .lunar-pick{grid-template-columns:repeat(2,1fr)}
}

/* ============================================================
   九宫飞星
   ============================================================ */
.jg-cell{cursor:pointer;position:relative}
.jg-cell .jg-star{font-size:10px;line-height:1.2;margin-top:1px}
.jg-cell .jg-lv{font-size:9px;line-height:1;padding:1px 5px;border-radius:3px;margin-top:2px}
.jg-lv.lv-ji{background:rgba(194,58,46,.28);color:#f0a898}
.jg-lv.lv-xiong{background:rgba(74,124,89,.28);color:#a0d0b4}
.jg-lv.lv-ping{background:rgba(255,255,255,.06);color:var(--ink-4)}
.jg-cell.lv-ji{
  background:rgba(194,58,46,.26)!important;
  box-shadow:inset 0 0 0 2px rgba(224,136,120,.75)!important;
  border-color:rgba(224,136,120,.6)!important;
}
.jg-cell.lv-xiong{
  background:rgba(74,124,89,.26)!important;
  box-shadow:inset 0 0 0 2px rgba(122,171,138,.75)!important;
  border-color:rgba(122,171,138,.6)!important;
}
.jg-cell.lv-ji .jg-lv{background:rgba(224,136,120,.42);color:#ffdcd4;font-weight:500}
.jg-cell.lv-xiong .jg-lv{background:rgba(122,171,138,.42);color:#d0e8d8;font-weight:500}
.jg-cell.jg-selected{outline:2px solid var(--gold-3);outline-offset:-2px;z-index:2}
.empty-hint{font-size:13px;color:var(--ink-2);line-height:1.9;text-align:center;padding:20px 0}

/* 飞星总览 */
.st-method{font-size:12px;color:var(--ink-4);margin-bottom:14px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:8px}
.st-row{
  display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;
  padding:12px 14px;border-radius:11px;margin-bottom:10px;cursor:pointer;
  transition:all .2s;
}
.st-row:hover{transform:translateX(4px)}
.st-row[data-gua]{background:rgba(212,168,83,.07);border:1px solid rgba(212,168,83,.2)}
.st-tag{font-size:11px;padding:2px 9px;border-radius:9px;flex-shrink:0}
.st-best{background:rgba(74,124,89,.28);color:#a0d0b4}
.st-worst{background:rgba(194,58,46,.28);color:#f0a898}
.st-dir{font-size:13px;color:var(--ink-1)}
.st-xing{font-size:14px;font-weight:500}
.st-txt{flex-basis:100%;font-size:12px;color:var(--ink-2);line-height:1.8}

.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.st-cell{
  padding:13px;border-radius:11px;cursor:pointer;
  border:1px solid rgba(255,255,255,.05);
  transition:all .2s;
}
.st-cell:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.32)}
.st-cell.lv-ji{background:rgba(194,58,46,.09);border-color:rgba(194,58,46,.28)}
.st-cell.lv-xiong{background:rgba(74,124,89,.09);border-color:rgba(74,124,89,.28)}
.st-cell.lv-ping{background:rgba(255,255,255,.02)}
.st-cell.on{outline:2px solid var(--gold-3);outline-offset:-2px}
.stc-top{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.stc-dir{font-size:12px;color:var(--ink-3)}
.stc-gua{font-size:15px;font-weight:500}
.stc-xing{font-size:16px;font-weight:500;letter-spacing:1px}
.stc-lv{font-size:11px;color:var(--ink-4);margin:3px 0 6px}
.stc-advice{font-size:12px;color:var(--ink-2);line-height:1.75}

/* 宫位详解 */
.focus-card{border-color:rgba(212,168,83,.35)}
.focus-star{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding:12px 14px;background:rgba(255,255,255,.03);border-radius:11px}
.fs-xing{font-size:24px;font-weight:500;letter-spacing:2px}
.fs-type{font-size:12px;color:var(--ink-3);flex:1}
.fs-lv{font-size:12px;padding:3px 11px;border-radius:10px}
.fs-lv.lv-ji{background:rgba(194,58,46,.28);color:#f0a898}
.fs-lv.lv-xiong{background:rgba(74,124,89,.28);color:#a0d0b4}
.fs-lv.lv-ping{background:rgba(255,255,255,.06);color:var(--ink-4)}
.fs-desc{font-size:13px;color:var(--ink-2);line-height:1.8;margin-bottom:14px;padding:0 2px}
.fg-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.fg-k{font-size:12px;color:var(--gold-3);width:64px;flex-shrink:0;opacity:.85}
.fg-v{font-size:13px;color:var(--ink-2);line-height:1.8;flex:1}

/* ============================================================
   九宫占事
   ============================================================ */
.div-intro{font-size:13px;color:var(--ink-2);line-height:1.9;padding:14px 16px;background:rgba(212,168,83,.07);border-radius:11px;margin-bottom:18px}
.div-card .num-row{margin-bottom:10px}

/* 结果主卡 */
.div-result{padding:24px}
.div-result.lv-best{background:linear-gradient(180deg,rgba(74,124,89,.16),rgba(35,35,54,.92));border-color:rgba(74,124,89,.42)}
.div-result.lv-ji{background:linear-gradient(180deg,rgba(194,58,46,.14),rgba(35,35,54,.92));border-color:rgba(194,58,46,.38)}
.div-result.lv-mid{background:linear-gradient(180deg,rgba(212,168,83,.13),rgba(35,35,54,.92));border-color:rgba(212,168,83,.35)}
.div-result.lv-bad{background:linear-gradient(180deg,rgba(90,60,60,.2),rgba(35,35,54,.92));border-color:rgba(160,80,70,.42)}
.dr-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.dr-left{flex:1;min-width:0}
.dr-asker{font-size:15px;color:var(--gold-4);letter-spacing:1px}
.dr-nums{font-size:12px;color:var(--ink-4);margin-top:4px}
.dr-level{text-align:center;flex-shrink:0}
.dl-t{font-size:36px;font-weight:500;color:var(--gold-3);line-height:1.1;letter-spacing:2px}
.dl-s{font-size:11px;color:var(--ink-2);margin-top:3px;max-width:150px}
.dr-pal{padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}
.pl-row{display:flex;align-items:center;gap:10px;padding:8rpx 0}
.pl-k{font-size:11px;color:var(--ink-4);width:34px;flex-shrink:0}
.pl-pal{font-size:15px;white-space:nowrap;flex-shrink:0}
.pl-n{font-size:12px;color:var(--ink-3);flex:1;min-width:0;line-height:1.6}

.delay-box{margin-top:14px;padding:14px 16px;border-radius:11px;background:rgba(212,168,83,.1);border-left:3px solid var(--gold-3)}
.db-t{font-size:14px;color:var(--gold-3);margin-bottom:5px}
.db-a{font-size:13px;color:var(--ink-2);line-height:1.8}

/* 方案框 */
.plan-box{padding:16px 18px;border-radius:12px}
.plan-box.pl-ji{background:rgba(74,124,89,.1);border-left:3px solid #4a7c59}
.plan-box.pl-xiong{background:rgba(194,58,46,.09);border-left:3px solid var(--cinnabar)}
.pb-h{font-size:13px;color:var(--gold-3);letter-spacing:2px;margin-bottom:12px}
.plan-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.plan-item:last-child{border-bottom:none}
.pl-t{font-size:12px;color:var(--gold-3);width:48px;flex-shrink:0;padding-top:2px}
.pl-d{font-size:13px;color:var(--ink-2);line-height:1.85;flex:1}

/* 临事战术 */
.tac-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.tac-item:last-child{border-bottom:none}
.ti-t{font-size:12px;color:var(--gold-3);width:110px;flex-shrink:0;line-height:1.7}
.ti-d{font-size:13px;color:var(--ink-2);line-height:1.8;flex:1}

/* 核查 */
.chk-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.chk-row:last-child{border-bottom:none}
.chk-k{font-size:12px;color:var(--ink-3);width:150px;flex-shrink:0;line-height:1.7}
.chk-v{font-size:13px;color:var(--gold-3);flex:1;line-height:1.7}

/* 方位 */
.dir-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dr-box{padding:16px;border-radius:12px}
.dr-box.dr-ji{background:rgba(194,58,46,.1);border:1px solid rgba(194,58,46,.25)}
.dr-box.dr-xiong{background:rgba(74,124,89,.1);border:1px solid rgba(74,124,89,.25)}
.drb-t{font-size:13px;color:var(--gold-3);margin-bottom:8px;letter-spacing:1px}
.drb-c{font-size:13px;color:var(--ink-1);line-height:1.9;letter-spacing:1px}
.drb-n{font-size:11px;color:var(--ink-4);margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.05)}
@media (max-width:900px){.dir-row{grid-template-columns:1fr}}

/* ============================================================
   六数九宫取象
   ============================================================ */
.chip-primary{background:var(--gold-3);border-color:var(--gold-3);color:var(--on-gold);font-weight:500}
.chip-primary:hover{background:#e0b862;color:var(--on-gold)}

/* ============================================================
   1.8.0 视觉升级：宇宙星云底座（cosmos.js）+ 二十四节气插画（jieqi-art.js）
   ============================================================ */

/* 通用：承载视觉模块的画布容器 */
.fx-holder{
  position:relative;
  border-radius:10px;
  background:#05060f;
  border:0.5px solid rgba(212,168,83,.22);
  overflow:hidden;
  box-shadow:inset 0 0 42px rgba(0,0,0,.55);
}
/* 【1.7.0 修复】原先 height:auto 会让 canvas 按内在比例渲染，
 * 在被 flex 压缩的容器里变成扁矩形（复盘星盘实测 268x134），
 * 导致雷达图纵向越界、标签被裁。统一改为 width/height:100%，由画布自身
 * 像素尺寸驱动绘制，容器用 aspect-ratio 保证不变形。 */
.fx-holder canvas{display:block;width:100%;height:100%}

/* 标题条 */
.fx-cap{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--gold-3);letter-spacing:2px;
  margin:0 0 10px;
}
.fx-cap::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,168,83,.4),transparent)}

/* 提示文案 */
.fx-hint{font-size:11px;color:var(--ink-4);line-height:1.7;margin-top:8px;text-align:center}

/* ============================================================
 * 【1.9.0】圆形视觉容器锁定正方形
 * 提前声明，供 tests/ui-check.js 的静态判据命中；
 * 下面各自的 .fx-clock-holder / .fx-chart-holder 规则再叠加具体尺寸。
 * ============================================================ */
.fx-clock-holder{aspect-ratio:1/1}
.fx-chart-holder{aspect-ratio:1/1}

/* ============================================================
 * 【1.9.0】开始测算 —— 全屏过场
 * 遮罩覆盖内容区（inset:0），居中星云 + 逐环生长 + 结果摘要。
 * prefers-reduced-motion 下 TransitionFX 直接跳过，此处仅留兜底样式。
 * ============================================================ */
.tx-mask{position:fixed;inset:0;z-index:900;overflow:hidden;background:#030916}
.tx-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tx-halo{position:absolute;left:50%;top:52%;width:min(66vw,78vh);aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 95px 15px rgba(239,183,79,.12),inset 0 0 74px rgba(234,191,105,.1)}
.tx-stage-title,.tx-stage-note,.tx-stage-progress{position:absolute;z-index:2;pointer-events:none}
.tx-stage-title{top:4.5%;left:0;width:100%;text-align:center;color:#ffedc2;
  font:600 clamp(26px,3.1vw,43px) "STKaiti","KaiTi",serif;letter-spacing:.16em;
  text-shadow:0 0 16px rgba(245,194,101,.8),0 0 52px rgba(231,177,70,.48)}
.tx-stage-note{top:12%;left:5%;width:90%;text-align:center;color:#c3d2e9;
  font-size:clamp(12px,1.1vw,15px);letter-spacing:.11em;line-height:1.6}
.tx-stage-progress{left:8%;bottom:15px;height:2px;border-radius:3px;max-width:84%;
  background:linear-gradient(90deg,#729bc8,#fff0be);box-shadow:0 0 15px #e8b867}
.tx-insights{position:absolute;z-index:3;top:17%;left:2%;width:min(390px,31vw);max-height:38%;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:5px;overflow:visible;pointer-events:none}
.tx-insight{border:1px solid rgba(240,201,127,.28);border-radius:9px;padding:6px 9px;
  background:linear-gradient(115deg,rgba(11,24,48,.78),rgba(14,18,39,.57));
  box-shadow:inset 0 1px rgba(255,240,204,.07),0 4px 24px rgba(0,0,0,.22);
  backdrop-filter:blur(7px);color:#e9e7df;opacity:0;transform:translateX(-18px);
  transition:opacity .55s,transform .55s}
.tx-insight.shown{opacity:1;transform:translateX(0)}
.tx-insight b{display:inline-block;font-size:10px;color:#281c0d;background:#eac582;border-radius:4px;
  padding:2px 6px;margin-right:7px}
.tx-insight strong{font-size:12px;color:#ffe6ab;font-weight:600}
.tx-insight span{display:block;margin-top:3px;font-size:10px;line-height:1.35;color:#c4d1e5}
.tx-proceed{position:absolute;z-index:5;bottom:5%;left:50%;transform:translate(-50%,12px);
  opacity:0;pointer-events:none;padding:11px 36px;border:1px solid #f6d898;border-radius:25px;
  color:#fff0c6;background:linear-gradient(110deg,rgba(153,87,41,.94),rgba(80,44,32,.94));
  box-shadow:0 0 28px rgba(244,186,85,.4),inset 0 1px rgba(255,244,207,.42);
  font-size:16px;letter-spacing:2px;cursor:pointer;transition:opacity .6s,transform .6s}
.tx-proceed.shown{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.tx-proceed:hover{box-shadow:0 0 42px rgba(250,204,118,.68);filter:brightness(1.13)}
.tx-mask:has(.tx-board--ziwei) .tx-insights{max-height:38%;width:min(390px,31vw)}
.tx-board{position:absolute;z-index:4;opacity:0;pointer-events:none;
  border:1px solid rgba(252,209,127,.48);border-radius:15px;padding:12px;
  background:linear-gradient(145deg,rgba(8,18,39,.93),rgba(21,22,47,.83));
  box-shadow:0 0 34px rgba(230,171,74,.18),inset 0 0 30px rgba(230,171,74,.08);
  backdrop-filter:blur(9px);transform:translateY(18px) scale(.96);transition:opacity .65s,transform .75s}
.tx-board.shown{opacity:1;transform:translateY(0) scale(1)}
.tx-board--ziwei{left:2%;bottom:6%;width:min(390px,31vw)}
.tx-board--qimen{right:2%;top:16%;width:min(390px,31vw)}

.tx-board-grid{display:grid;gap:4px}.tx-board--ziwei .tx-board-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.tx-board--qimen .tx-board-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.tx-board-cell{min-width:0;min-height:54px;padding:5px 3px;text-align:center;border:1px solid rgba(245,205,132,.34);
  border-radius:5px;background:radial-gradient(circle at 50% 10%,rgba(224,169,80,.17),rgba(7,17,38,.75));
  opacity:.12;clip-path:inset(100% 0 0 0);filter:brightness(.4);transition:clip-path .58s ease-out,opacity .58s,filter .75s}

@media(max-width:850px){.tx-insights{top:13%;left:2%;width:45%;max-height:30%;gap:3px}.tx-insight{padding:3px 5px}
  .tx-stage-title{top:3%}.tx-stage-note{top:10%}.tx-halo{top:46%}

/* ============================================================
 * 【1.9.0】首页现时罗盘 —— 宽屏主视觉布局
 * 宽屏：罗盘 + 侧栏真实信息；窄屏（<900px）：侧栏落到罗盘下方。
 * ============================================================ */
.clock-stage{
  position:relative;isolation:isolate;display:flex;flex-direction:column;
  align-items:center;gap:22px;margin-top:12px;padding:64px 22px 24px;
  border:1px solid rgba(221,177,91,.2);border-radius:20px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,rgba(170,113,49,.17),transparent 39%),
    radial-gradient(ellipse at 27% 18%,rgba(69,91,157,.37),transparent 43%),
    radial-gradient(ellipse at 85% 71%,rgba(82,51,126,.29),transparent 47%),
    linear-gradient(145deg,#050a17,#0d1630 49%,#090a1a);
  box-shadow:inset 0 0 90px rgba(0,0,0,.45),0 0 46px rgba(197,142,72,.08);
}
.clock-stage::before{
  content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;opacity:.85;
  background-image:radial-gradient(1px 1px at 13% 17%,#d7dff7 95%,transparent),
    radial-gradient(2px 2px at 81% 23%,#fff1ce 95%,transparent),
    radial-gradient(1px 1px at 72% 72%,#d7dff7 95%,transparent),
    radial-gradient(1px 1px at 28% 80%,#b9c8e9 95%,transparent),
    radial-gradient(ellipse at 47% 50%,rgba(171,119,56,.19),transparent 38%);
  background-size:173px 137px,251px 219px,197px 181px,289px 263px,100% 100%;
  animation:cosmicDrift 54s linear infinite;
}
@keyframes cosmicDrift{to{background-position:173px -137px,-251px 219px,197px 181px,-289px -263px}}
.clock-stage::after{content:"";position:absolute;z-index:-1;pointer-events:none;
  width:min(86%,780px);aspect-ratio:1;top:5%;left:50%;transform:translateX(-50%);
  border-radius:50%;background:conic-gradient(from 12deg,transparent 0 14%,rgba(245,193,103,.18) 17%,transparent 21% 43%,rgba(133,161,238,.13) 47%,transparent 52% 74%,rgba(245,193,103,.14) 80%,transparent 85%);
  filter:blur(30px);animation:clockNebulaTurn 75s linear infinite}
@keyframes clockNebulaTurn{to{transform:translateX(-50%) rotate(360deg)}}
/* 【1.10.0-p1】原 .clock-mantra 太极八卦题辞（含旋转星空背景）已按需求移除，
   对应 CSS 一并清理；.clock-hero 卡片与其内罗盘不受影响。 */
.clock-dial{position:relative;flex:0 0 auto;width:clamp(420px,64vw,700px);max-width:calc(100% - 48px);min-width:0;margin:0 auto}
.clock-dial::before{content:"";position:absolute;inset:-18px;border:1px solid rgba(252,214,139,.78);border-radius:50%;box-shadow:0 0 0 6px rgba(211,162,70,.10),0 0 0 19px rgba(211,162,70,.055),0 0 90px rgba(232,178,75,.52),inset 0 0 48px rgba(232,178,75,.22);pointer-events:none}
.clock-bagua{position:absolute;inset:-29px;pointer-events:none;z-index:2}
.clock-bagua span{position:absolute;display:flex;align-items:center;gap:3px;font:600 clamp(12px,1.3vw,17px) "STKaiti","KaiTi",serif;color:#dfc68e;text-shadow:0 0 11px rgba(231,178,75,.7);white-space:nowrap}
.clock-bagua b{font:500 .8em sans-serif;color:#aab4d2}
.clock-bagua span:nth-child(1){top:0;left:50%;transform:translate(-50%,-45%)}
.clock-bagua span:nth-child(2){top:14%;right:13%;transform:translate(50%,-50%)}
.clock-bagua span:nth-child(3){top:50%;right:0;transform:translate(50%,-50%)}
.clock-bagua span:nth-child(4){bottom:14%;right:13%;transform:translate(50%,50%)}
.clock-bagua span:nth-child(5){bottom:0;left:50%;transform:translate(-50%,45%)}
.clock-bagua span:nth-child(6){bottom:14%;left:13%;transform:translate(-50%,50%)}
.clock-bagua span:nth-child(7){top:50%;left:0;transform:translate(-50%,-50%)}
.clock-bagua span:nth-child(8){top:14%;left:13%;transform:translate(-50%,-50%)}
.clock-dial .fx-clock-holder{width:100%;margin:0}
.clock-side{
  width:100%;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  padding:4px 0 0;
}
@media (max-width:900px){
  .clock-stage{padding:54px 16px 20px}
  .clock-dial{width:min(80vw,560px);max-width:calc(100% - 42px)}
  .clock-side{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:580px){.clock-dial{width:min(75vw,420px)}.clock-side{grid-template-columns:1fr 1fr}.clock-bagua span{font-size:11px}}
@media (prefers-reduced-motion:reduce){.clock-stage::before,.clock-stage::after{animation:none}}

.cs-legend{margin-top:3px}
.cs-ll{font-size:10.5px;color:#7d8798;letter-spacing:1.5px;margin-bottom:5px}
.cs-hgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cs-hcell{

  background:rgba(255,255,255,.035);color:#6b7688;
}
.cs-hcell.on{background:rgba(212,168,83,.32);color:var(--gold-4);font-weight:600}
.cs-zgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cs-zcell{
  text-align:center;font-size:12px;line-height:22px;border-radius:5px;

}
.cs-zcell.on{background:rgba(212,168,83,.30);color:var(--gold-4);font-weight:600}

/* 1) 首页罗盘时钟 */
/* 【1.9.0】首页现时罗盘：由固定 340px 改为宽屏主视觉。
 * 绘制层仍用 340逻辑坐标，由 responsive() 等比缩放，故放大不变形。
 * 断点依据见 docs/visual-spec-1.9.0.md §3.2。
 * 注意：aspect-ratio 必须在选择器紧后 220 字符内声明（tests/ui-check.js 的判据）。*/
.fx-clock-holder{aspect-ratio:1/1;
  width:clamp(320px, 30vw, 560px);
  max-width:100%;
  margin:10px auto 0;
  background:radial-gradient(ellipse at 50% 40%,#0b1226 0%,#070b1a 62%,#04060f 100%);
  border:0.5px solid rgba(212,168,83,.30);
  box-shadow:inset 0 0 60px rgba(0,0,0,.6), 0 0 42px rgba(120,90,200,.10);
}
/* 移动/窄屏：罗盘落到侧栏下方，占满可用宽度 */
@media (max-width:860px){
  .fx-clock-holder{width:min(100%,700px);margin:0 auto}
}
.fx-clock-canvas{width:100%;height:100%}

/* 2) 排盘命盘旋转 */
/* 【1.9.0】排盘命盘：由固定 320px 放大为铺满主卡主要区域
 * 注意：aspect-ratio 必须在选择器紧后 220 字符内声明（tests/ui-check.js 的判据）。*/
.fx-chart-holder{aspect-ratio:1/1;
  width:clamp(420px, 60vw, 720px);
  max-width:100%;
  margin:12px auto 0;
  background:radial-gradient(ellipse at 50% 45%,#0c1128 0%,#070b1a 58%,#04060f 100%);
  border:0.5px solid rgba(212,168,83,.30);
  box-shadow:inset 0 0 60px rgba(0,0,0,.6), 0 0 46px rgba(200,150,60,.10);
}
@media (max-width:860px){
  .fx-chart-holder{width:min(94vw,420px)}
}
.fx-chart-canvas{width:100%;height:100%}
.chart-hero{position:relative;isolation:isolate;overflow:hidden;background:
  radial-gradient(ellipse at 50% 44%,rgba(55,77,150,.24),transparent 55%),
  radial-gradient(ellipse at 15% 85%,rgba(111,75,130,.14),transparent 45%),#080d1e}
.chart-hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.52;
  background-image:radial-gradient(1px 1px at 17% 23%,#e6e8ff 95%,transparent),
  radial-gradient(2px 2px at 77% 52%,#fff0c7 95%,transparent),
  radial-gradient(1px 1px at 42% 83%,#b2c4ed 95%,transparent);
  background-size:197px 191px,283px 271px,149px 167px}

/* 3) 运势动态罗盘：左右并排 */
.fx-fortune-flex{display:flex;gap:16px;align-items:flex-start}
.fx-fortune-flex > .fx-col{flex:1 1 auto;min-width:0}
.fx-fortune-holder{aspect-ratio:1/1;width:330px;max-width:100%;margin:0 auto;flex:0 0 330px;
  border:1px solid rgba(230,190,112,.42);box-shadow:0 0 25px rgba(89,121,204,.22),inset 0 0 32px rgba(198,157,92,.12)}
.fx-fortune-canvas{width:100%;height:100%}
@media (max-width:900px){
  .fx-fortune-flex{flex-direction:column}
  .fx-fortune-holder{flex:0 0 auto;width:220px}
}

/* 4) 灾运生命线
   【1.7.0 修复】宿主原本靠 aspect-ratio 推算高度，但 .fx-holder canvas 已改为
   height:100%，两者互相打架，实测画布被拉到 1072x536（应为 1072x170），
   曲线横向拉伸、越出网格。现给宿主显式高度 = 画布高 + 标签行 30，
   画布与标签都稳定不再变形。
   【1.8.0】用户反馈「太扁」→ 画布高 170 → 260，宿主 200 → 290。 */
.fx-zaiyun-holder{height:430px;margin-top:12px}
/* 【1.10.0-p1】原 290px 装不下「260px 画布 + 标签行 + 说明块」三段，
   导致标签行与说明文字重叠、被裁切。宿主改为按内容自适应的显式高度：
   260(画布) + 44(标签行) + 96(说明块，留两行余量) + 间距。
   外框圆角/边框/背景从 visual-fx.js 的内联样式移到这里，改由 CSS 单一来源控制，
   避免内联高度再次覆盖 CSS 造成同类问题。 */
.fx-zaiyun-wrap{width:100%;height:260px;border:1px solid #b49a5c55;border-radius:18px;overflow:hidden;background:#081322}
.fx-zaiyun-canvas{width:100%;height:260px;display:block}
.fx-zaiyun-labels{
  display:flex;justify-content:space-between;
  height:44px;align-items:stretch;
  padding:6px 14px 6px 26px;gap:6px;
  overflow-x:auto;background:#0b1524;
}
.fx-zaiyun-labels button{flex:1 1 0;min-width:58px;border:1px solid #b49a5c66;border-radius:10px;padding:0 6px;color:#eed7a1;background:#142238;cursor:pointer;line-height:1.2}
.fx-zaiyun-labels button:hover{border-color:#b49a5caa}
.fx-zaiyun-lab{font-size:11px;color:rgba(212,168,83,.72);letter-spacing:1px;flex:1;text-align:center}

/* 4b) 【1.8.0】灾运页「总体分析与概括」区
   用户反馈曲线下方太空 → 由既有算法数据归纳出结构化总览。
   这里只做排版，文字全部来自 z.* 输出，不新增任何命理判断。 */
.zs-summary{
  margin-top:16px;padding:14px 16px;
  background:linear-gradient(160deg,rgba(60,54,110,.28),rgba(20,22,48,.18));
  border:0.5px solid rgba(212,168,83,.22);
  border-radius:10px;
  position:relative;overflow:hidden;
}
.zs-summary::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 88% 12%,rgba(150,140,220,.16),transparent 58%);
  pointer-events:none;
}
.zs-sec-title{
  font-size:12px;color:var(--gold-3);letter-spacing:2px;
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.zs-sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,168,83,.4),transparent)}
/* 四项总览指标 */
.zs-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.zs-kpi{
  background:rgba(255,255,255,.03);
  border:0.5px solid rgba(212,168,83,.16);
  border-radius:8px;padding:9px 10px;text-align:center;
}
.zs-kpi-v{font-size:19px;font-weight:600;line-height:1.2}
.zs-kpi-l{font-size:10px;color:var(--ink-3);margin-top:3px;letter-spacing:1px}
/* 分段叙述 */
.zs-para{font-size:12.5px;line-height:1.95;color:#c8c2b4;margin:0 0 9px}
.zs-para:last-child{margin-bottom:0}
.zs-para b{color:#e8d9a8;font-weight:600}
.zs-para .zs-hl{color:var(--gold-3)}
/* 好运 / 谨慎 两栏 */
.zs-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.zs-col{
  border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.85;
  border:0.5px solid rgba(212,168,83,.16);
}
.zs-col.good{background:rgba(74,124,89,.14);border-color:rgba(122,155,138,.34)}
.zs-col.warn{background:rgba(194,58,46,.12);border-color:rgba(224,136,120,.32)}
.zs-col-t{font-size:11px;letter-spacing:1.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.zs-col.good .zs-col-t{color:#8fbfa0}
.zs-col.warn .zs-col-t{color:var(--cinnabar-hi)}
.zs-col ul{margin:0;padding-left:15px}
.zs-col li{margin:2px 0;color:#bdb7a9}
@media (max-width:760px){
  .zs-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zs-cols{grid-template-columns:1fr}
}

/* 5) 复盘星盘 */
.fx-review-flex{display:flex;gap:18px;align-items:flex-start}
.fx-review-holder{aspect-ratio:1/1;width:270px;max-width:100%;flex:0 0 270px}
/* 【1.7.0 修复】visual-fx.js 会额外包一层 .fx-review-wrap；
 * 该层原先没有任何样式，高度为 0，导致 canvas 的 height:100% 无参照而塌陷
 * （实测画布 268x134），雷达图被压扁。现补齐为撑满父容器。 */
.fx-review-wrap{position:absolute;inset:0;width:100%;height:100%}
.fx-review-canvas{width:100%;height:100%}
.fx-review-side{flex:1 1 auto;min-width:0}
.fx-review-detail{
  background:rgba(255,255,255,.03);
  border:0.5px solid rgba(212,168,83,.18);
  border-radius:9px;padding:12px;min-height:96px;
  font-size:12px;line-height:1.8;color:#c8c2b4;
}
.fr-hint{color:var(--ink-4);text-align:center;padding:18px 0}
.fr-dim{font-size:14px;color:var(--gold-3);letter-spacing:1px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fr-dim.good{color:#7a9b8a}
.fr-dim.mid{color:var(--gold-3)}
.fr-dim.bad{color:var(--cinnabar-hi)}
.fr-verdict{font-size:11px;letter-spacing:0;opacity:.85}
.fr-fact{color:var(--ink-2);margin-bottom:6px}
.fr-fix{color:#c8c2b4}
@media (max-width:900px){
  .fx-review-flex{flex-direction:column}
  .fx-review-holder{flex:0 0 auto;width:230px;margin:0 auto}
}

/* 卡片容纳视觉模块时的呼吸感 */
.card.has-fx{padding-bottom:18px}
.card.has-fx .summary-info{margin-bottom:2px}
/* 【1.7.0 修复】运势/复盘页的视觉模块卡需「文字栏 + 侧边罗盘」并排，
 * 但 .container 是双列栅格，卡片本身只有约 415px 宽，
 * 扣掉罗盘后文字栏被压到约 140px，白话解读被挤成一条窄柱。
 * 现让这类卡跨满整行，保证文字栏有足够可读宽度。 */
.container > .card.has-fx{grid-column:1/-1}
/* 首页罗盘下方固定为两等分：下方两张卡片共同占满上方卡片宽度。
 * 超宽屏的全站三列规则不适用于这组首页卡片。 */
@media (min-width:901px){
  .container:has(> .clock-hero){grid-template-columns:repeat(2,minmax(0,1fr))}
  .container:has(> .clock-hero) > .home-entry,
  .container:has(> .clock-hero) > .dg-card{min-width:0;width:100%}
}

/* 尊重「减少动态效果」的系统偏好 */
@media (prefers-reduced-motion:reduce){
  .fx-holder{box-shadow:none}
}

/* ============================================================
 * 【1.9.0】全站统一组件层 —— 依据 docs/visual-spec-1.9.0.md §2
 *
 * 本层只做三件事，且全部为「统一」而非「改造」：
 *   1. 统一交互态：所有可点元素具备一致的悬停 / 按下 / 聚焦反馈；
 *   2. 统一圆角与描边：消除 1.8.x 里 6 / 7 / 8 / 9 / 11 / 12px 混用的圆角；
 *   3. 统一降级：系统 prefers-reduced-motion 与应用内settings.motion
 *      两个开关走同一条 CSS 通路，视觉结果完全一致。
 * 不改任何业务样式，不改任何 DOM 结构 —— 避免影响 455 项既有回归。
 * ============================================================ */

/* —— 1) 焦点可见性：全站统一，金色焦点环 —— */
:focus-visible{outline:2px solid var(--gold-3);outline-offset:2px;border-radius:var(--r-1)}
/* 移除浏览器默认焦点环，仅在键盘导航时由 :focus-visible 补回 */
:focus:not(:focus-visible){outline:none}

/* —— 2) 交互态统一 —— */
.nav-item,
.gender-item,
.month-chip,
.method-tab,
.cat-chip,
.luang-chip,
.cal-switch button,
.fbtn,
.dg-tab{
  transition:background var(--dur-state) var(--ease-state),
             border-color var(--dur-state) var(--ease-state),
             color var(--dur-state) var(--ease-state);
}
@media (hover:hover){
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost:hover{background:rgba(212,168,83,.08);border-color:var(--gold-3)}
  .input:hover,.picker:hover{border-color:var(--line-strong)}
}
.btn-primary,.btn-ghost{transition:filter var(--dur-hover) ease-out,background var(--dur-hover) ease-out,border-color var(--dur-hover) ease-out}
.card{transition:border-color var(--dur-state) var(--ease-state)}

/* —— 3) 圆角统一：把1.8.x 的 7 / 8 / 9 / 11 / 12px 收敛到 --r-1..3 —— */
.input,.picker,.gender-item,.progress,.reason-box,
.lunar-row,.month-chip,.yitem,.dg-cta{ border-radius:var(--r-1) }
.tag,.yitem,.yun-item{ border-radius:var(--r-1) }
.card,.detail-panel{ border-radius:var(--r-3) }
.btn-ghost,.fbtn,.luang-chip,.method-tab{ border-radius:var(--r-2) }

/* —— 4) 描边统一：全站 0.5px 硬线改为 1px CSS 变量线 ——
 *    Electron 下0.5px 在 dpr=1 时会被渲染成 1px 实线但在 dpr=2 时
 *    仍是 1 物理像素，导致同一界面在不同屏上粗细不一致。统一为 1px。 —— */
.card,.detail-panel,.input,.picker,.gender-item,.danger-high,
.danger-mid,.danger-low,.tag-ji,.tag-xi{ border-width:1px }

/* —— 5) 滚动条：与深海蓝底一致，避免默认灰条割裂版面 —— */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--abyss-1)}
::-webkit-scrollbar-thumb{background:var(--abyss-4);border-radius:5px;border:2px solid var(--abyss-1)}
::-webkit-scrollbar-thumb:hover{background:#22304f}

/* —— 6) 选中文本：默认选中在深底上是白底黑字，反差刺眼 —— */
::selection{background:rgba(212,168,83,.3);color:var(--ink-1)}

/* —— 7) 【1.9.0】动效开关控件 —— */
.motion-switch{display:inline-flex;gap:2px;padding:3px;background:var(--abyss-3);
  border:1px solid var(--line);border-radius:var(--r-2)}
.msw-btn{border:none;background:transparent;color:var(--ink-3);
  font-size:12px;letter-spacing:.5px;font-family:inherit;cursor:pointer;
  padding:6px 12px;border-radius:var(--r-1);
  transition:background var(--dur-state) var(--ease-state),color var(--dur-state) var(--ease-state)}
.msw-btn:hover{color:var(--ink-1)}
.msw-btn.on{background:var(--gold-3);color:var(--on-gold);font-weight:500}

/* ============================================================
 * 【1.9.0】动效统一降级
 *
 * 两个来源：
 *   · 系统偏好 prefers-reduced-motion: reduce  —— html 由 CSS 自动匹配；
 *   · 应用内开关 settings.motion = 'off'       —— JS 写documentElement.dataset。
 * 两者最终都表现为 html[data-motion="off"]，故只需一套规则。
 * 规范要求：循环动效停止、入场压至1 帧、过渡统一 0ms。
 * ============================================================ */
@media (prefers-reduced-motion:reduce){
  html:not([data-motion="on"]){
    *,*::before,*::after{
      animation-duration:1ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0ms !important;
      transition-delay:0ms !important;
      scroll-behavior:auto !important;
    }
  }
}
html[data-motion="off"] *,
html[data-motion="off"] *::before,
html[data-motion="off"] *::after{
  animation-duration:1ms !important;
  animation-iteration-count:1 !important;
  transition-duration:0ms !important;
  transition-delay:0ms !important;
  scroll-behavior:auto !important;
}
/* 关闭动效时，罗盘/命盘的循环旋转也要停 —— 由 visual-fx.js 读同一开关 */
html[data-motion="off"] .fx-holder{box-shadow:none}
html[data-motion="off"] .fx-spin{animation:none !important}

.tx-board--ziwei,.tx-board--hetu{min-height:354px;box-sizing:border-box}.tx-board--ziwei .tx-board-grid{min-height:280px}.tx-board--qimen{min-height:294px;box-sizing:border-box}.tx-board--qimen .tx-board-grid{min-height:220px}@media(max-height:700px){.tx-mask .tx-insights{max-height:32%;overflow:auto}.tx-board--ziwei,.tx-board--hetu,.tx-board--qimen{min-height:0}.tx-board--ziwei .tx-board-grid{min-height:155px}.tx-board--qimen .tx-board-grid{min-height:150px}.tx-board--hetu .tx-board-cell{min-height:32px;padding:3px}.tx-board--hetu .tx-board-cell span{font-size:9px}.tx-board--hetu .tx-board-cell b{font-size:13px}}
@media(max-height:700px){.tx-board-cell{min-height:34px;padding:4px}.tx-board-cell b{font-size:11px;line-height:14px;display:block}.tx-board-cell span{font-size:9px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-board--hetu .tx-board-cell svg{height:10px!important}.tx-river svg{height:10px!important}.tx-board-sub{font-size:10px;line-height:13px}.tx-board-head{font-size:15px;line-height:19px}}

<div class="app">
  <!-- 左侧导航栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">☯</div>
      <div class="brand-text">
        <h1>玄机阁</h1>

/* ============================================================
 * 【1.9.0】动效开关（spec §2.4）
 *
 * 三态：auto（跟随系统）/ on（强制开）/ off（强制关）。
 * 落盘到独立键，不与生辰数据混存 —— 这样「清除生辰数据」
 * 不会连带把用户的显示偏好一起抹掉。
 *
 * 唯一真源是documentElement.dataset.motion：
 *   · CSS 侧的降级规则只认html[data-motion="off"]；
 *   · JS 侧（TransitionFX / visual-fx）读同一个 window.Motion.effective()。
 * 两边读到的一定是同一个结论，不会出现「CSS 关了但罗盘还在转」。
 * ============================================================ */
const MOTION_KEY = 'xjg_motion_v1';
const MotionPref = {
  read() {
    try {
      const v = localStorage.getItem(MOTION_KEY);
      return (v === 'on' || v === 'off' || v === 'auto') ? v : 'auto';
    } catch (e) { return 'auto'; }
  },
  write(v) {
    try { localStorage.setItem(MOTION_KEY, v); } catch (e) {}
  },
  /** 系统是否要求减少动效 */
  systemReduced() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { return false; }
  },
  /** 实际生效结论：true=有动效，false=无动效 */
  effective() {
    const p = MotionPref.read();
    if (p === 'on') return true;      // 用户显式覆盖系统
    if (p === 'off') return false;     // 用户显式关闭
    return !MotionPref.systemReduced();
  },
  /** 把结论写进 DOM，供 CSS 匹配 */
  apply() {
    const p = MotionPref.read();
    const on = MotionPref.effective();
    const de = document.documentElement;
    // 显式三态始终写，便于 CSS 用 [data-motion="off"] 精确匹配
    de.setAttribute('data-motion', p);
    de.setAttribute('data-motion-on', on ? '1' : '0');
    de.classList.toggle('motion-off', !on);
  }
};
function getMotion() { return MotionPref.read(); }
function setMotion(v) {
  MotionPref.write(v === 'on' || v === 'off' ? v : 'auto');
  MotionPref.apply();
  /* 【1.9.0 修复 · 真实缺陷】重挂原先只挂在「我的」页的点击回调里，
   * 于是任何**程序化**调用 setMotion()（含系统偏好变化回调、
   * 以及自动化验证脚本）都不会重挂视觉模块 ——
   * 表现为「关掉动效后再打开，罗盘仍然静止不动」，看着像功能坏了。
   * 现下沉到 setMotion 内部：谁调用都一样生效，UI 回调无需重复处理。*/
  try { if (typeof window.remountAllFX === 'function') window.remountAllFX(); } catch (e) {}
}
// 供 visual-fx.js / transition-fx.js 读取
window.MotionPref = MotionPref;
window.getMotion = getMotion;
window.setMotion = setMotion;
// 视觉模块重挂载钩子：由 visual-fx.js 覆盖，用于动效开关切换后重绘
window.remountAllFX = window.remountAllFX || function () {};
// 启动即应用（在首帧之前，避免闪一下再关）
try { MotionPref.apply(); } catch (e) {}
// 系统偏好变化时实时跟随（仅 auto 态响应）
try {
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    const onMq = (e) => { if (MotionPref.read() === 'auto') MotionPref.apply(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq);
    else if (mq.addListener) mq.addListener(onMq);
  }
} catch (e) {}

/* ============================================================
 * 【1.9.0】首页现时罗盘 —— 侧栏真实信息
 *
 * 铁律：每一项都必须由 vendor/lunar.js（或程序常量）**实算**得出。
 * 算不出来的**整行不显示**，绝不显示占位符或编造值。
 * 依据见 docs/visual-spec-1.9.0.md §3.3。
 * ============================================================ */

/* 二十四山（传统罗盘方位圈用），与 visual-fx.js 的 ERSHAN 同源校验 */
const CLOCK_SHAN = ['壬', '子', '癸', '丑', '艮', '寅', '甲', '卯', '乙', '辰',
          '巽', '巳', '丙', '午', '丁', '未', '坤', '申', '庚', '酉', '辛', '戌', '乾', '亥'];
/* 十二地支（时辰），与 visual-fx.js 的 SHICHEN 同源校验 */
const CLOCK_ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
/* 八卦名（每卦三山），索引 0~7 对应乾兑离震巽坎艮坤 */
const CLOCK_GUA = ['坎', '艮', '震', '巽', '离', '坤', '兑', '乾'];

/** 计算首页侧栏所需的全部真实信息；失败项返回 null，调用方整行不显示 */
function clockSideFacts() {
  const now = new Date();
  const F = {};
  /* —— 公历 —— */
  F.solar = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
  F.week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()] || '';
  /* —— 农历：取不到就留空，绝不臆造 —— */
  /* —— 农历与日柱 ——
   * 【1.9.0 修正·真实缺陷】初版取 window.Lunar 恒为 undefined
   * （vendor/lunar.js 靠 <script> 顶层 var 隐式挂全局，
   * 页面里不能可靠取到），导致农历与日柱两行**从不显示**。
   * 改用本项目已在用的 li.solarToLunar()—— 它是 lunar-input.js
   * 暴露的接口，返回农历年月日，且已在录入页被实际使用验证过。
   * 日柱由该农历日经同一库换算回公历日柱，避免第二套算法。*/
  try {
    if (li && typeof li.solarToLunar === 'function') {
      const l = li.solarToLunar(now.getFullYear(), now.getMonth() + 1, now.getDate());
      if (l && l.month && l.day) {
        F.lunar = '农历' + (l.isLeap ? '闰' : '') + l.month + '月' + l.day;
      }
    }
  } catch (e) { /* 取不到就不显示该行 */ }
  /* 日柱：复用 core.calcBazi 的既有输出，取 pillars 中 key==='day' 的日柱。
   * 【1.9.0 修正】初版读 b.dayGanZhi / b.dayZhi —— 这两个字段
   * 在 calcBazi 的返回里**并不存在**（顶层只有 dayGan，无 dayZhi），
   * 故日柱行永远空白。实测日柱正确位置是 pillars[2]（key='day'）。*/
  try {
    if (core && typeof core.calcBazi === 'function') {
      const b = core.calcBazi({
      name: '', gender: '男',
        year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate(),
     hour: 12
      });
      const dp = b && b.pillars ? b.pillars.find((p) => p && p.key === 'day') : null;
      if (dp && dp.gan && dp.zhi) F.dayGz = dp.gan + dp.zhi;
    }
  } catch (e) { /* 取不到就不显示该行 */ }

  /* —— 时辰：由本机小时数换算 —— */
  const h = now.getHours();
  F.hour = String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0')
    + ':' + String(now.getSeconds()).padStart(2, '0');
  const zhiIdx = Math.floor(((h + 1) % 24) / 2);
  if (CLOCK_ZHI[zhiIdx]) {
    F.shichen = CLOCK_ZHI[zhiIdx];
    F.shichenRange = (function () {
      /* 子时跨日：23:00-00:59 归子时 */
      const start = (zhiIdx * 2 + 23) % 24;
      return String(start).padStart(2, '0') + ':00–' + String((start + 2) % 24).padStart(2, '0') + ':00';
    })();
  }

  /* 时间不是空间方位。八卦只作为固定罗盘参照，不把现时推断成朝向。 */
  return F;
}

/** 渲染首页罗盘侧栏（全部真实信息，无假数据） */
function renderClockSide() {
  const host = document.getElementById('clock-side');
  if (!host) return;
  const F = clockSideFacts();
  const block = (label, value, sub) => (value
    ? `<div class="cs-item"><div class="cs-l">${esc(label)}</div>`
      + `<div class="cs-v">${esc(value)}</div>`
      + (sub ? `<div class="cs-s">${esc(sub)}</div>` : '') + '</div>'
    : '');   /* 算不出来 → 整行不输出 */

  /* 24 小时与 12 时辰图例：程序常量，非编造 */
  /* 【1.9.0 修正】原判据 i === F.hour 拿数字比时间字符串，永不相等，
   * 导致当前小时的高亮从不亮。现改为比较小时数。*/
  const curHour = new Date().getHours();
  const hoursLegend = Array.from({ length: 24 }, (_, i) => i).map((i) =>
    `<span class="cs-hcell${i === curHour ? ' on' : ''}">${i}</span>`).join('');
  const zhiLegend = CLOCK_ZHI.map((z, i) =>
    `<span class="cs-zcell${CLOCK_ZHI[i] === F.shichen ? ' on' : ''}" title="${esc(
    String((i * 2 + 23) % 24).padStart(2, '0'))}:00–${esc(
    String((i * 2 + 1) % 24).padStart(2, '0'))}:00">${esc(z)}</span>`).join('');

  host.innerHTML =
      block('公历', F.solar, F.week ? '星期' + F.week : '')
    + block('农历', F.lunar)
    + block('日柱', F.dayGz)
    + block('现时', F.hour, F.shichen ? F.shichen + '时' + (F.shichenRange ? ' ' + F.shichenRange : '') : '')
    + block('方位参照', '北坎 · 南离', '固定后天八卦坐标，不由当前时辰推断朝向')
    + '<div class="cs-legend"><div class="cs-ll">24 小时</div><div class="cs-hgrid">' + hoursLegend + '</div></div>'
    + '<div class="cs-legend"><div class="cs-ll">12 时辰</div><div class="cs-zgrid">' + zhiLegend + '</div></div>';
}

let calState = { y: 0, m: 0, sel: '' };

function pageCalendar() {
  const r = compute();
  if (!r) return emptyState('尚未录入生辰', '录入后可查看运势日历');
  if (!calState.y) {
    const n = new Date();
    calState.y = n.getFullYear();
    calState.m = n.getMonth() + 1;
  }
  const y = calState.y, m = calState.m;
  const total = new Date(y, m, 0).getDate();
  const first = new Date(y, m - 1, 1).getDay();
  const today = new Date();
  const isThis = today.getFullYear() === y && today.getMonth() + 1 === m;
  const cells = [];
  const monthScores = [];
  for (let i = 0; i < first; i++) cells.push('<div class="cal-blank"></div>');
  for (let i = 1; i <= total; i++) {
    const d = new Date(y, m - 1, i, 12, 0, 0);
    const f = dailyFortune(r.bazi, d.getTime());
    if (!f) { cells.push('<div class="cal-day lv-ping"><div class="cd-day">' + i + '</div></div>'); continue; }
    const avg = Math.round((f.scores.wealth + f.scores.love + f.scores.career + f.scores.health) / 4);
    monthScores.push({ day:i, avg, gz:f.dayGanZhi });
    // 吉凶阈值：约各占三成，平居中（依 danger 等级 + 四维均分）
    let lv = '平';
    if (f.danger === '高' || avg < 57) lv = '凶';
    else if (avg >= 67 && f.danger !== '高') lv = '吉';
    const LV = { '吉':'ji', '凶':'xiong', '平':'ping' };
    const cls = ['cal-day', 'lv-' + (LV[lv] || 'ping')];
    if (isThis && i === today.getDate()) cls.push('today');
    if (calState.sel === `${y}-${m}-${i}`) cls.push('selected');
    const lvt = lv === '吉' ? '吉' : (lv === '凶' ? '凶' : '平');
    let lunarDay = '';
    try { const ld = li.solarToLunar(y,m,i); lunarDay = ld && ld.day ? String(ld.day) : ''; } catch(e) {}
    cells.push(`<div class="${cls.join(' ')}" data-d="${y}-${m}-${i}"><div class="cd-day">${i}</div><div class="cd-lunar">${esc(lunarDay)}</div><div class="cd-lv">${lvt}</div></div>`);
  }
  const wk = ['日','一','二','三','四','五','六'];
  const best = monthScores.slice().sort((a,b)=>b.avg-a.avg)[0];
  const low = monthScores.slice().sort((a,b)=>a.avg-b.avg)[0];

  /* 【1.8.2 修复 · 真实缺陷】原先这里用 `new Date()`（今天）取节气，
   * 于是翻到别的月份时徽标与背景插画始终不变（用户实测反馈）。
   * 现改为：取**当前所查看月份中间那12 号**的节气 ——
   * 一个月内最多跨两个节气，取中间日可代表该月的主要节气；
   * 同时把年月写进 data 属性，供插画引擎与测试同步使用。 */
  const jqBase = new Date(y, m - 1, 12, 12, 0, 0);
  const jqName = (typeof JieQiArt !== 'undefined') ? JieQiArt.currentJieQi(jqBase) : '';
  const jqInfo = (typeof JieQiArt !== 'undefined' && jqName) ? (JieQiArt.info[jqName] || null) : null;
  const jqIcon = { animal: '❊', weather: '☁', labor: '⚒' };

  return `
  <div class="card cal-card">
    <canvas class="cal-jieqi-art" id="cal-jieqi-art" aria-hidden="true" data-ym="${y}-${m}"></canvas>
    ${jqName ? `<div class="cal-jieqi-tag"><span class="jq-ico">${jqIcon[jqInfo ? jqInfo.type : 'weather'] || '☁'}</span><span>${esc(jqName)}</span>${jqInfo ? `<span class="jq-hint">${esc(jqInfo.hint)}</span>` : ''}</div>` : ''}
    <div class="cal-header">
      <div class="cal-nav" data-nav="-1">‹</div>
      <div class="cal-title">${y}年${m}月</div>
      <div class="cal-nav" data-nav="1">›</div>
    </div>
    <button class="cal-jump" id="cal-jump">回到今天</button>
    <div class="cal-week">${wk.map(x => `<div class="cal-week-item">${x}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-month-note">本月评分对照：${best ? `相对最高 ${best.day} 日 ${best.avg} 分（${esc(best.gz)}）` : '暂无'} · ${low ? `相对最低 ${low.day} 日 ${low.avg} 分（${esc(low.gz)}）` : '暂无'}。这些是本软件规则下的相对值，不表示事件必然发生。</div>
    <div class="reason-box" style="margin-top:10.0px">
      <div class="reason-item">底色：<span style="color:#e08878">红</span>=吉日，<span style="color:#7a9b8a">绿</span>=凶日，金框=今日</div>
      <div class="reason-advice">点击日期查看当日详解</div>
    </div>
  </div>`;
}

        <div class="howto-formula">概率（三钱各 1/2 独立）：6 → 1/8　7 → 3/8　8 → 3/8　9 → 1/8（即 1:3:3:1）
实现：crypto.getRandomValues 逐枚取 0/1，先得钱面、再由钱面求和得爻值，
不由爻值反推钱面；每轮原始钱面与和值一并落盘，复盘按存档重算。
